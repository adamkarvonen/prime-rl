# Usage:
#   uv run --no-sync rl @ examples/reverse_text/rl.toml @ examples/reverse_text/slurm_smoke_2gpu.toml --dry-run

output_dir = "outputs/reverse-text-slurm-smoke-p18080"
max_steps = 2
seq_len = 1024

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[wandb]
project = "reverse-text-smoke"
name = "reverse-text-slurm-smoke"
offline = true
shared = false

[orchestrator]
batch_size = 32
rollouts_per_example = 8

[orchestrator.train.sampling]
max_completion_tokens = 64

[inference]
gpu_memory_utilization = 0.90

[inference.server]
port = 18080

[inference.model]
max_model_len = 2048

[orchestrator.client]
base_url = ["http://localhost:18080/v1"]

[slurm]
job_name = "prime-rev-smoke"
project_dir = "/workspace-vast/adamk/prime-rl"
template_path = "/workspace-vast/adamk/prime-rl/cluster_templates/single_node_rl_shared.sbatch.j2"
partition = "general"
time = "00:45:00"
