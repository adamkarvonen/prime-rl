# Usage:
#   /home/adamk/.local/bin/uv run rl \
#     @ examples/model_understanding/rl_3gpu_thinking_lora_warmstart.toml \
#     @ examples/model_understanding/rl_3gpu_thinking_lora_warmstart_smoke.toml \
#     --dry-run

output_dir = "outputs/mu-rl-lora-warmstart-smoke"
max_steps = 1

[deployment]
gpus_per_node = 2
num_train_gpus = 1
num_infer_gpus = 1

[wandb]
project = "model-understanding-rl"
name = "mu-rl-lora-warmstart-smoke"
offline = true
shared = false

[ckpt]
interval = 1
keep_last = 2
resume_step = 0

[orchestrator]
batch_size = 2
rollouts_per_example = 2
max_inflight_rollouts = 4

[[orchestrator.train.env]]
id = "model-understanding-rl"
name = "model_understanding"
args = { dataset_path = "/workspace-vast/adamk/activation_oracles_dev/investigations/model_understanding_prime_rl/results/prime_mu_investigation_only_dataset/train.jsonl", dataset_split = "train", tokenizer_name = "/workspace-vast/adamk/activation_oracles_dev/checkpoints_text_sft/mu_qwen3_8b_50k_s7_synth_e1_kl1/final", tokenizer_trust_remote_code = false, chat_template_kwargs = { enable_thinking = false }, judge_model = "claude-haiku-4-5-20251001", judge_concurrency = 8, judge_thinking_budget = 1024, judge_max_tokens = 1400, judge_mode = "thinking_json", transcript_dir = "/workspace-vast/adamk/prime-rl/transcripts/lora-warmstart-smoke" }
timeout = 300

[orchestrator.client]
base_url = ["http://localhost:19185/v1"]

[inference]
gpu_memory_utilization = 0.90
data_parallel_rpc_port = 24185

[inference.server]
port = 19185

[inference.model]
max_model_len = 5000

[slurm]
job_name = "prime-mu-lora-smoke"
project_dir = "/workspace-vast/adamk/prime-rl"
template_path = "/workspace-vast/adamk/prime-rl/cluster_templates/single_node_rl_shared.sbatch.j2"
partition = "general"
time = "00:45:00"
