# Smoke test for the structured-judge env: 20 steps, same setup as the full run
# but quick. Verifies the env loads, judge calls work, reward signal is non-trivial,
# wandb logs the per-component metrics, and the transcript jsonl gets written.
output_dir = "outputs/mu-rl-32b-structured-judge-smoke"
clean_output_dir = true
max_steps = 20
seq_len = 4096
max_async_level = 1

[deployment]
gpus_per_node = 4
num_train_gpus = 2
num_infer_gpus = 2

[model]
name = "/workspace-vast/adamk/prime-rl/outputs/mu_qwen3_32b_s7_synth_v2_e1_kl1_merged"

[wandb]
project = "model-understanding-rl"
name = "mu-rl-32b-structured-judge-smoke"
offline = false
shared = true

[ckpt]
interval = 100
keep_last = 1

[orchestrator]
batch_size = 64
rollouts_per_example = 8
max_inflight_rollouts = 40
max_off_policy_steps = 3
use_token_client = true
filters = [
    { type = "gibberish", enforce = false, token_id_threshold = 100000, logprob_offset = 2.0 },
    { type = "repetition", enforce = false, window = 3000, prob_threshold = 0.99 },
    { type = "zero_advantage", enforce = false },
]

[orchestrator.train]
num_workers = 1
max_retries = 0

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 512

[[orchestrator.train.env]]
id = "model-understanding-rl-structured"
name = "model_understanding_rl_structured"
args = { dataset_path = "/workspace-vast/adamk/activation_oracles_dev/investigations/model_understanding_prime_rl/results/prime_mu_32b_structured_dataset/train.jsonl", dataset_split = "train", tokenizer_name = "/workspace-vast/adamk/prime-rl/outputs/mu_qwen3_32b_s7_synth_v2_e1_kl1_merged", tokenizer_trust_remote_code = false, chat_template_kwargs = { enable_thinking = false }, judge_model = "claude-sonnet-4-6", judge_concurrency = 40, judge_max_tokens = 8192, judge_thinking_budget = 4096, reward_reduction = "core_anti_hack_v2", reward_alpha_core = 0.20, reward_alpha_ref = 0.20, reward_format_fail_reward = -1.0, transcript_dir = "/workspace-vast/adamk/prime-rl/transcripts/32b-structured-judge-smoke" }
timeout = 600

[orchestrator.client]
base_url = ["http://localhost:19183/v1"]

[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.ac]
mode = "full"

[trainer.model.lora]
rank = 64
alpha = 128.0
dropout = 0.05
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.optim]
lr = 5e-6

[trainer.ckpt]
skip_gather_master_weights = true
weights_only = false

[trainer.ckpt.weights]
save_adapter_separately = true

[inference]
gpu_memory_utilization = 0.90
data_parallel_rpc_port = 24183

[inference.server]
port = 19183

[inference.model]
max_model_len = 5000
enforce_eager = false

[inference.vllm_extra.default_chat_template_kwargs]
enable_thinking = false

[slurm]
job_name = "prime-mu-32b-smoke"
project_dir = "/workspace-vast/adamk/prime-rl"
template_path = "/workspace-vast/adamk/prime-rl/cluster_templates/single_node_rl_shared.sbatch.j2"
partition = "general"
time = "0-04:00:00"
exclude = "node-1,node-2,node-3,node-4,node-5,node-11,node-16,node-18,node-25,node-27,node-29,node-30"
